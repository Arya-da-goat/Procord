<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Sign in · Procord</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-comments"></i></span>procord</a><span class="header-note">A better way to connect.</span></header><main><section class="auth-card"><div class="card-icon"><i class="fa-solid fa-arrow-right-to-bracket"></i></div><h1>Welcome Back</h1><p class="subtitle">Sign in to continue to Procord.</p><div class="form-error" data-form-error role="alert" hidden></div><div class="notice" data-notice role="status" hidden></div><form data-auth-form="login"><div class="field"><div class="field-row"><label for="email">Email address</label></div><div class="input-wrap"><i class="fa-regular fa-envelope"></i><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254"></div></div><div class="field"><div class="field-row"><label for="password">Password</label><a href="forgot-password.html">Forgot password?</a></div><div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required maxlength="128"><button class="toggle-password" type="button" data-password-toggle="password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div></div><div class="form-options"><label class="check"><input type="checkbox" name="rememberMe"> Keep me signed in</label></div><button class="primary" type="submit">Sign In <i class="fa-solid fa-arrow-right"></i></button></form><div class="divider">OR</div><p class="auth-switch">New to Procord? <a href="signup.html">Create an account</a></p></section></main><footer class="site-footer"><a href="terms.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a></footer><script type="module" src="js/auth.js"></script></body></html>
