<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>Create account · Procord</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><i class="fa-solid fa-comments"></i></span>procord</a><span class="header-note">Your next conversation starts here.</span></header><main><section class="auth-card"><div class="card-icon"><i class="fa-solid fa-user-plus"></i></div><h1>Create your account</h1><p class="subtitle">Join Procord in just a moment.</p><div class="form-error" data-form-error role="alert" hidden></div><div class="notice" data-notice role="status" hidden></div><form data-auth-form="signup"><div class="field"><div class="field-row"><label for="email">Email address</label></div><div class="input-wrap"><i class="fa-regular fa-envelope"></i><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254"></div></div><div class="field"><div class="field-row"><label for="password">Password</label></div><div class="input-wrap"><i class="fa-solid fa-lock"></i><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a strong password" required minlength="10" maxlength="128"><button class="toggle-password" type="button" data-password-toggle="password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><div class="strength"><span data-strength-bar></span></div><small class="strength-label" data-strength-text>Use a strong password</small><ul class="password-rules"><li data-rule="length">10–128 characters</li><li data-rule="lower">One lowercase letter</li><li data-rule="upper">One uppercase letter</li><li data-rule="number">One number</li></ul></div><div class="field"><div class="field-row"><label for="confirmPassword">Confirm password</label></div><div class="input-wrap"><i class="fa-solid fa-shield-halved"></i><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter password again" required maxlength="128"></div></div><div class="field"><label class="check terms-check"><input type="checkbox" name="acceptTerms" required> I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</label></div><button class="primary" type="submit">Create Account <i class="fa-solid fa-arrow-right"></i></button></form><div class="divider">ALREADY A MEMBER?</div><p class="auth-switch"><a href="login.html">Sign in to your account</a></p></section></main><footer class="site-footer"><a href="terms.html">Terms of Service</a><a href="privacy.html">Privacy Policy</a></footer><script type="module" src="js/auth.js"></script></body></html>
